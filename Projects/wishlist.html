<script>

// Clear Wishlist
function clearWishlist(){

    if(confirm("Are you sure you want to clear your wishlist?")){

        wishlist = [];

        localStorage.setItem("wishlist", JSON.stringify(wishlist));

        displayWishlist();

    }

}

</script>
