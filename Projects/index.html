<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshBite - Online Food Ordering</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🍔 FreshBite</h1>
    <p>Fresh & Delicious Food Delivered Fast</p>
</header>

<h2>Our Menu</h2>

<div class="food">
    <h3>🍕 Pizza</h3>
    <p>Price: ₹250</p>
    <button onclick="addToCart('Pizza',250)">Add to Cart</button>
</div>

<div class="food">
    <h3>🍔 Burger</h3>
    <p>Price: ₹150</p>
    <button onclick="addToCart('Burger',150)">Add to Cart</button>
</div>

<div class="food">
    <h3>🍗 Chicken Biryani</h3>
    <p>Price: ₹300</p>
    <button onclick="addToCart('Chicken Biryani',300)">Add to Cart</button>
</div>

<h2>Shopping Cart</h2>
<ul id="cart"></ul>
<h3 id="total">Total: ₹0</h3>

<button onclick="placeOrder()">Place Order</button>

<p id="status"></p>

<script src="script.js"></script>

</body>
</html>
